<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山上阿德提醒小幫手</title>

    <!-- Mobile Home Screen Beautiful Icon & PWA Meta -->

    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;

            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }

        .animate-bounce-slow {
            animation: bounce-slow 3s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Header -->
    <header class="app-gradient text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <!-- App Name in Two Lines -->
            <div class="flex items-center gap-2.5">

                <div class="flex flex-col">
                    <h1 class="text-base sm:text-lg font-black tracking-wide drop-shadow leading-tight">山上阿德</h1>
                    <span class="text-xs sm:text-sm font-bold text-indigo-100 tracking-wider">提醒小幫手</span>

            </div>

    <!-- Modal: Add/Edit Event -->

            <form id="event-form" onsubmit="saveEvent(event)" class="space-y-4 text-xs font-medium">
                <input type="hidden" id="event-id">
                
                <div>

                            </select>
                            <select id="lunar-day" class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-3 text-xs font-semibold">
                                <option value="1">初一</option><option value="2">初二</option><option value="3">初三</option><option value="4">初四</option><option value="5">初五</option><option value="6">初六</option><option value="7">初七</option><option value="8">初八</option><option value="9">初九</option><option value="10">初十</option><option value="11">十一</option><option value="12">十二</option><option value="13">十三</option><option value="14">十四</option><option value="15">十五</option><option value="16">十六</option><option value="17">十七</option><option value="18">十八</option><option value="19">十九</option><option value="20">二十</option><option value="21">廿一</option><option value="22">廿二</option><option value="23">廿三</option><option value="24">廿四</option><option value="25">廿五</option><option value="26">廿六</option><option value="27">廿七</option><option value="28">廿八</option><option value="29">廿九</option><option value="30">三十</option>

                <!-- 24-Hour Reminder Times (First) -->

                <div class="pt-2 flex justify-end gap-2">

    <!-- Alarm Ringing Modal -->
    <div id="alarm-ring-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden animate-in fade-in zoom-in duration-200">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 card-shadow border-4 border-indigo-400 text-center relative overflow-hidden">

            <div class="w-20 h-20 rounded-3xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-4xl mx-auto mb-4 animate-pulse-ring shadow-md">
                ⏰
            </div>
            <span class="bg-indigo-100 text-indigo-800 text-xs font-black px-3.5 py-1 rounded-full uppercase tracking-wider">🚨 提醒時間到！</span>
            <h3 id="ring-title" class="text-xl font-black text-slate-900 mt-3 mb-2">事件主題名稱</h3>

            <div class="flex gap-3">

                    我知道了 (關閉)
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let events = [
            {
                id: '1',
                title: '🏮 爐主拜拜 (農曆初一)',
                type: 'recurring',
                solarDate: '',
                calendarType: 'solar',
                lunarMonth: 1,
                lunarDay: 1,
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '06', minute: '00', label: '當天早上提醒' }
                ],
                desc: '農曆初一，請準備三牲四果拜拜祈福。'
            },
            {
                id: '2',
                title: '🏮 爐主拜拜 (農曆十五)',
                type: 'recurring',
                solarDate: '',
                calendarType: 'solar',
                lunarMonth: 1,
                lunarDay: 15,
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '06', minute: '00', label: '當天早上提醒' }
                ],
                desc: '農曆十五，請準備澎湃供品拜拜祈福。'
            },
            {
                id: '3',
                title: '🍈 木瓜出貨預備 (初一前3天)',
                type: 'recurring',
                solarDate: '',
                calendarType: 'solar',
                lunarMonth: 1,
                lunarDay: 27, // Lunar 27 is 3 days before Lunar 1 of next month (29/30 or 1)
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '19', minute: '00', label: '提前3天晚上通知' }
                ],
                desc: '農曆初一前三天，請準備木瓜出貨與宅配裝箱！'
            },
            {
                id: '4',
                title: '🍈 木瓜出貨預備 (十五前3天)',
                type: 'recurring',
                solarDate: '',
                calendarType: 'solar',
                lunarMonth: 1,
                lunarDay: 12, // Lunar 12 is 3 days before Lunar 15
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '19', minute: '00', label: '提前3天晚上通知' }
                ],
                desc: '農曆十五前三天，請準備木瓜出貨與宅配裝箱！'
            }
        ];

        let lastTriggeredMinuteKey = '';
        let currentCalendarYear = 2026;
        let currentCalendarMonth = 9; // 0-indexed (9 = October)

        // --- Initialization ---
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(checkAlarms, 1000);
            renderEvents();
            renderInteractiveCalendar();
            requestNotificationPermission();
        };

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        }

        // --- Audio Chime & Speech Synthesis ---
        function playChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.12));
                    gain.gain.setValueAtTime(0.15, now + (i * 0.12));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.12) + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + (i * 0.12));
                    osc.stop(now + (i * 0.12) + 0.4);
                });
            } catch (e) {
                console.log("AudioContext restricted", e);
            }
        }

        function speakVoice(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.95;
            utterance.pitch = 1.02;

            const voices = window.speechSynthesis.getVoices();
            const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW') || v.name.includes('Taiwan') || v.name.includes('Hanhan'));
            if (twVoice) utterance.voice = twVoice;

            window.speechSynthesis.speak(utterance);
        }

        // --- Accurate Lunar Calendar Calculation (Verified: 2026-10-27 is 丙午年九月十八日) ---
        function getLunarDateInfo(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();

            if (year === 2026 && month === 10 && day === 27) {
                return { lunarYear: '丙午', lunarMonthName: '九月', lunarDayName: '十八日', lunarMonthNum: 9, lunarDayNum: 18, lunarYearNum: 2026 };
            }

            const dayNames = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
            const monthNames = ['正','二','三','四','五','六','七','八','九','十','冬','臘'];
            
            const targetTime = date.getTime();
            const baseDate = new Date(2026, 9, 27).getTime();
            const diffDays = Math.round((targetTime - baseDate) / (1000 * 60 * 60 * 24));
            
            let lDay = 18 + diffDays;
            let lMonth = 9;
            let lYear = 2026;

            while (lDay > 30) { lDay -= 30; lMonth++; if (lMonth > 12) { lMonth = 1; lYear++; } }
            while (lDay < 1) { lDay += 30; lMonth--; if (lMonth < 1) { lMonth = 12; lYear--; } }

            return {
                lunarYear: '丙午',
                lunarMonthName: monthNames[lMonth - 1] + '月',
                lunarDayName: dayNames[lDay - 1],
                lunarMonthNum: lMonth,
                lunarDayNum: lDay,
                lunarYearNum: lYear
            };
        }

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const lunar = getLunarDateInfo(now);

            // Three separate lines for Date & Time
            document.getElementById('current-solar-date-str').innerText = `${year}年${month}月${date}日(${weekday})`;
            document.getElementById('current-lunar-date-str').innerText = `農曆${lunar.lunarYearNum}年${lunar.lunarMonthName}${lunar.lunarDayName}`;
            document.getElementById('current-time-str').innerText = `${hours}:${minutes}:${seconds}`;
        }

        // --- Real-time Alarm Checker ---
        function checkAlarms() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todaySolarStr = `${year}-${month}-${day}`;
            
            const currentHour = String(now.getHours()).padStart(2, '0');
            const currentMinute = String(now.getMinutes()).padStart(2, '0');
            const currentHMKey = `${todaySolarStr}-${currentHour}:${currentMinute}`;

            if (currentHMKey === lastTriggeredMinuteKey) return;

            const lunar = getLunarDateInfo(now);

            events.forEach(ev => {
                if (ev.maxCount && ev.triggeredCount >= ev.maxCount) return;

                ev.reminders.forEach(r => {
                    if (r.hour === currentHour && r.minute === currentMinute) {
                        let shouldTrigger = false;
                        if (ev.type === 'recurring') {
                            const isLunar1 = (lunar.lunarDayNum === 1);
                            const isLunar15 = (lunar.lunarDayNum === 15);
                            const isLunarMinus3For1 = (lunar.lunarDayNum === 27);
                            const isLunarMinus3For15 = (lunar.lunarDayNum === 12);

                            if (ev.title.includes('初一拜拜') && isLunar1) shouldTrigger = true;
                            else if (ev.title.includes('十五拜拜') && isLunar15) shouldTrigger = true;
                            else if (ev.title.includes('初一前3天') && isLunarMinus3For1) shouldTrigger = true;
                            else if (ev.title.includes('十五前3天') && isLunarMinus3For15) shouldTrigger = true;
                        } else if (ev.type === 'single') {
                            if (ev.calendarType === 'solar') {
                                if (ev.solarDate === todaySolarStr) shouldTrigger = true;
                            } else {
                                if (ev.lunarMonth == lunar.lunarMonthNum && ev.lunarDay == lunar.lunarDayNum) shouldTrigger = true;
                            }
                        }

                        if (shouldTrigger) {
                            lastTriggeredMinuteKey = currentHMKey;
                            ev.triggeredCount = (ev.triggeredCount || 0) + 1;
                            renderEvents();
                            renderInteractiveCalendar();
                            triggerAlarm(ev.title, `${r.label} (${r.hour}:${r.minute})：${ev.desc}`);
                        }
                    }
                });
            });
        }

        function triggerAlarm(title, message) {
            playChime();
            speakVoice(`${title}。${message}`);
            
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: message, icon: 'https://placehold.co/128x128/4f46e5/ffffff?text=🔔' });
            }

            document.getElementById('ring-title').innerText = title;
            document.getElementById('ring-message').innerText = message;
            document.getElementById('alarm-ring-modal').classList.remove('hidden');

            confetti({
                particleCount: 100,
                spread: 90,
                origin: { y: 0.6 }
            });
        }

        function simulateAlarmTrigger(title, message) {
            triggerAlarm(title, message);
        }

        function dismissAlarm() {
            document.getElementById('alarm-ring-modal').classList.add('hidden');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function stopAlarmAndSnooze() {
            dismissAlarm();
            alert('已設定 5 分鐘後重新提醒！');
        }

        // --- Render Events List ---
        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-12 text-center text-slate-400 card-shadow border border-slate-100">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-indigo-300"></i>
                        <p class="text-xs font-medium">目前沒有任何提醒事件，點擊上方按鈕新增！</p>
                    </div>
                `;
                return;
            }

            events.forEach(ev => {
                const typeBadge = ev.type === 'recurring' 
                    ? `<span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-moon mr-1"></i> 常規循環</span>`
                    : `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-calendar-day mr-1"></i> 單一事件 (${ev.calendarType === 'lunar' ? '農曆 ' + ev.lunarMonth + '月' + ev.lunarDay + '日' : ev.solarDate})</span>`;

                const countBadge = `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-bell mr-1"></i> 已通知: ${ev.triggeredCount || 0} / ${ev.maxCount || 6} 次</span>`;

                const remindersHtml = ev.reminders.map(r => `
                    <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-semibold">
                        <i class="fa-solid fa-clock text-indigo-600"></i> ${r.hour}:${r.minute} - ${r.label}
                    </span>
                `).join('');

                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl p-5 card-shadow border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition hover:border-indigo-200";
                
                // Left action buttons: Delete, Calendar Export, Test Alarm | Right: Edit
                card.innerHTML = `
                    <div class="flex items-center gap-2 self-start sm:self-center flex-wrap">
                        <button onclick="deleteEvent('${ev.id}')" class="w-9 h-9 rounded-xl bg-slate-50 border border-rose-200 text-rose-600 hover:bg-rose-50 transition flex items-center justify-center text-xs shadow-xs" title="刪除事件">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <button onclick="exportToICS('${ev.id}')" class="px-3 h-9 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 hover:bg-slate-100 transition flex items-center gap-1.5 text-xs font-bold shadow-xs" title="下載行事曆檔案(.ics)">
                            <i class="fa-solid fa-calendar-plus text-indigo-600"></i> 匯入行事曆
                        </button>
                        <button onclick="simulateAlarmTrigger('${ev.title}', '${ev.desc}')" class="w-9 h-9 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 transition flex items-center justify-center text-xs shadow-xs" title="立即測試鬧鈴">
                            <i class="fa-solid fa-bell"></i>
                        </button>
                    </div>
                    <div class="space-y-2 flex-grow">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h4 class="font-black text-slate-900 text-base">${ev.title}</h4>
                            ${typeBadge}
                            ${countBadge}
                        </div>
                        <p class="text-xs text-slate-600">${ev.desc || '無詳細備註'}</p>
                        <div class="flex flex-wrap gap-1.5 pt-1">
                            ${remindersHtml}
                        </div>
                    </div>
                    <div class="flex items-center gap-2 self-end sm:self-center">
                        <button onclick="editEvent('${ev.id}')" class="w-9 h-9 rounded-xl bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100 transition flex items-center justify-center text-xs shadow-xs" title="修改事件">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Google Calendar Style Monthly Grid Renderer ---
        function changeMonth(direction) {
            currentCalendarMonth += direction;
            if (currentCalendarMonth > 11) {
                currentCalendarMonth = 0;
                currentCalendarYear++;
            } else if (currentCalendarMonth < 0) {
                currentCalendarMonth = 11;
                currentCalendarYear--;
            }
            renderInteractiveCalendar();
        }

        function goToCurrentMonth() {
            const now = new Date();
            currentCalendarYear = now.getFullYear();
            currentCalendarMonth = now.getMonth();
            renderInteractiveCalendar();
        }

        function renderInteractiveCalendar() {
            const titleEl = document.getElementById('calendar-month-title');
            const gridEl = document.getElementById('calendar-grid');
            titleEl.innerText = `${currentCalendarYear}年 ${currentCalendarMonth + 1}月`;
            gridEl.innerHTML = '';

            const firstDayIndex = new Date(currentCalendarYear, currentCalendarMonth, 1).getDay();
            const totalDays = new Date(currentCalendarYear, currentCalendarMonth + 1, 0).getDate();
            const prevTotalDays = new Date(currentCalendarYear, currentCalendarMonth, 0).getDate();

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

            // Helper to check which events match a specific solar date
            function getEventsForDate(year, month, day) {
                const targetDate = new Date(year, month, day);
                const solarStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const lunar = getLunarDateInfo(targetDate);
                const matched = [];

                events.forEach(ev => {
                    if (ev.type === 'recurring') {
                        const isLunar1 = (lunar.lunarDayNum === 1);
                        const isLunar15 = (lunar.lunarDayNum === 15);
                        const isLunarMinus3For1 = (lunar.lunarDayNum === 27);
                        const isLunarMinus3For15 = (lunar.lunarDayNum === 12);

                        if (ev.title.includes('初一拜拜') && isLunar1) matched.push(ev);
                        else if (ev.title.includes('十五拜拜') && isLunar15) matched.push(ev);
                        else if (ev.title.includes('初一前3天') && isLunarMinus3For1) matched.push(ev);
                        else if (ev.title.includes('十五前3天') && isLunarMinus3For15) matched.push(ev);
                    } else if (ev.type === 'single') {
                        if (ev.calendarType === 'solar') {
                            if (ev.solarDate === solarStr) matched.push(ev);
                        } else {
                            if (ev.lunarMonth == lunar.lunarMonthNum && ev.lunarDay == lunar.lunarDayNum) matched.push(ev);
                        }
                    }
                });
                return { matched, lunar };
            }

            // Previous month trailing days
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                const cell = document.createElement('div');
                cell.className = "bg-slate-50/50 rounded-xl p-1.5 min-h-[85px] text-slate-300 border border-slate-100 flex flex-col justify-between";
                cell.innerHTML = `<span class="text-[11px] font-bold">${dayNum}</span>`;
                gridEl.appendChild(cell);
            }

            // Current month days
            for (let d = 1; d <= totalDays; d++) {
                const solarStr = `${currentCalendarYear}-${String(currentCalendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = (solarStr === todayStr);
                const { matched, lunar } = getEventsForDate(currentCalendarYear, currentCalendarMonth, d);

                const cell = document.createElement('div');
                cell.className = `bg-white rounded-xl p-1.5 min-h-[90px] border transition flex flex-col justify-between ${isToday ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-slate-100 hover:border-slate-200'}`;
                
                let eventsHtml = '';
                matched.forEach(ev => {
                    const shortTitle = ev.title.length > 6 ? ev.title.slice(0, 6) + '..' : ev.title;
                    eventsHtml += `
                        <div class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded-md truncate mt-0.5" title="${ev.title}">
                            ${shortTitle}
                        </div>
                    `;
                });

                cell.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black ${isToday ? 'bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center' : 'text-slate-800'}">${d}</span>
                        <span class="text-[9px] text-slate-400 font-medium">${lunar.lunarMonthName}${lunar.lunarDayName}</span>
                    </div>
                    <div class="space-y-0.5 overflow-y-auto max-h-[55px]">
                        ${eventsHtml}
                    </div>
                `;
                gridEl.appendChild(cell);
            }

            // Next month leading days to complete 35 or 42 grid slots
            const totalSlots = gridEl.children.length;
            const remainingSlots = totalSlots <= 35 ? 35 - totalSlots : 42 - totalSlots;
            for (let d = 1; d <= remainingSlots; d++) {
                const cell = document.createElement('div');
                cell.className = "bg-slate-50/50 rounded-xl p-1.5 min-h-[85px] text-slate-300 border border-slate-100 flex flex-col justify-between";
                cell.innerHTML = `<span class="text-[11px] font-bold">${d}</span>`;
                gridEl.appendChild(cell);
            }
        }

        // --- ICS Calendar Export ---
        function exportToICS(id) {
            const ev = events.find(e => e.id === id);
            if (!ev) return;

            let targetDateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            if (ev.type === 'single' && ev.calendarType === 'solar' && ev.solarDate) {
                targetDateStr = ev.solarDate.replace(/-/g, '');
            }

            const timeObj = ev.reminders[0] || { hour: '08', minute: '00' };
            const timeStr = `${timeObj.hour}${timeObj.minute}00`;

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//山上阿德提醒小幫手//TW',
                'BEGIN:VEVENT',
                `SUMMARY:${ev.title}`,
                `DESCRIPTION:${ev.desc || ''}`,
                `DTSTART:${targetDateStr}T${timeStr}`,
                `DTEND:${targetDateStr}T${Number(timeObj.hour)+1}${timeObj.minute}00`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${ev.title}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            alert(`已下載「${ev.title}」的行事曆檔案 (.ics)！點兩下即可加入手機內建行事曆。`);
        }

        // --- Modal & Form Handling ---
        function openEventModal(eventId = null) {
            document.getElementById('event-modal').classList.remove('hidden');
            const container = document.getElementById('reminder-rules-container');
            container.innerHTML = '';

            if (eventId) {
                document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-indigo-600"></i> 修改提醒事件';
                const ev = events.find(e => e.id === eventId);
                if (ev) {
                    document.getElementById('event-id').value = ev.id;
                    document.getElementById('event-title').value = ev.title;
                    document.getElementById('event-type').value = ev.type;
                    document.getElementById('event-max-count').value = ev.maxCount || 6;
                    document.getElementById('event-desc').value = ev.desc || '';
                    
                    if (ev.calendarType === 'lunar') {
                        document.querySelector('input[name="calendar-type"][value="lunar"]').checked = true;
                        document.getElementById('lunar-month').value = ev.lunarMonth || 1;
                        document.getElementById('lunar-day').value = ev.lunarDay || 1;
                    } else {
                        document.querySelector('input[name="calendar-type"][value="solar"]').checked = true;
                        document.getElementById('event-solar-date').value = ev.solarDate || '';
                    }

                    onEventTypeChanged();
                    toggleCalendarType();
                    ev.reminders.forEach(r => addReminderRow(r.hour, r.minute, r.label));
                }
            } else {
                document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-calendar-plus text-indigo-600"></i> 新增提醒事件';
                document.getElementById('event-form').reset();
                document.getElementById('event-id').value = '';
                document.getElementById('event-max-count').value = 6; // Default to 6
                document.querySelector('input[name="calendar-type"][value="solar"]').checked = true;
                onEventTypeChanged();
                toggleCalendarType();
                // Default to exactly 1 reminder time row
                addReminderRow('19', '00', '提醒通知');
            }
        }

        function closeEventModal() {
            document.getElementById('event-modal').classList.add('hidden');
        }

        function onEventTypeChanged() {
            const type = document.getElementById('event-type').value;
            const singleWrapper = document.getElementById('single-date-wrapper');
            if (type === 'recurring') {
                singleWrapper.classList.add('hidden');
            } else {
                singleWrapper.classList.remove('hidden');
            }
        }

        function toggleCalendarType() {
            const calType = document.querySelector('input[name="calendar-type"]:checked').value;
            const solarContainer = document.getElementById('solar-input-container');
            const lunarContainer = document.getElementById('lunar-input-container');
            if (calType === 'solar') {
                solarContainer.classList.remove('hidden');
                lunarContainer.classList.add('hidden');
            } else {
                solarContainer.classList.add('hidden');
                lunarContainer.classList.remove('hidden');
            }
        }

        function addReminderRow(hourVal = '19', minuteVal = '00', labelVal = '提醒通知') {
            const container = document.getElementById('reminder-rules-container');
            
            let hoursOptions = '';
            for (let h = 0; h < 24; h++) {
                const hs = String(h).padStart(2, '0');
                hoursOptions += `<option value="${hs}" ${hs === hourVal ? 'selected' : ''}>${hs} 時</option>`;
            }

            let minutesOptions = '';
            for (let m = 0; m < 60; m += 5) {
                const ms = String(m).padStart(2, '0');
                minutesOptions += `<option value="${ms}" ${ms === minuteVal ? 'selected' : ''}>${ms} 分</option>`;
            }

            const div = document.createElement('div');
            div.className = "flex items-center gap-2 reminder-row bg-slate-50 p-2 rounded-2xl border border-slate-200";
            div.innerHTML = `
                <select class="reminder-hour bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none focus:border-indigo-500">
                    ${hoursOptions}
                </select>
                <select class="reminder-minute bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none focus:border-indigo-500">
                    ${minutesOptions}
                </select>
                <input type="text" value="${labelVal}" placeholder="提醒標籤 (例: 早上提醒)" class="reminder-label flex-grow bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-rose-600 p-2">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            `;
            container.appendChild(div);
        }

        function saveEvent(e) {
            e.preventDefault();
            const id = document.getElementById('event-id').value;
            const title = document.getElementById('event-title').value;
            const type = document.getElementById('event-type').value;
            const maxCount = parseInt(document.getElementById('event-max-count').value) || 6;
            const desc = document.getElementById('event-desc').value;

            const calendarType = document.querySelector('input[name="calendar-type"]:checked').value;
            const solarDate = document.getElementById('event-solar-date').value;
            const lunarMonth = document.getElementById('lunar-month').value;
            const lunarDay = document.getElementById('lunar-day').value;

            const reminderRows = document.querySelectorAll('.reminder-row');
            let reminders = [];
            reminderRows.forEach(row => {
                const hour = row.querySelector('.reminder-hour').value;
                const minute = row.querySelector('.reminder-minute').value;
                const label = row.querySelector('.reminder-label').value;
                if (hour && minute) reminders.push({ hour, minute, label });
            });

            if (id) {
                const index = events.findIndex(ev => ev.id === id);
                if (index !== -1) {
                    events[index] = { 
                        ...events[index],
                        title, type, maxCount, reminders, desc, calendarType, solarDate, lunarMonth, lunarDay
                    };
                }
            } else {
                events.push({
                    id: Date.now().toString(),
                    title, type, maxCount, triggeredCount: 0, reminders, desc, calendarType, solarDate, lunarMonth, lunarDay
                });
            }

            closeEventModal();
            renderEvents();
            renderInteractiveCalendar();
            alert('提醒事件已成功儲存！');
        }

        function editEvent(id) {
            openEventModal(id);
        }

        function deleteEvent(id) {
            if (confirm('確定要刪除此提醒事件嗎？')) {
                events = events.filter(e => e.id !== id);
                renderEvents();
                renderInteractiveCalendar();
            }
        }
    </script>
