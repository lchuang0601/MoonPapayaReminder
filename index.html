<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山上阿德提醒小幫手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Mobile Home Screen Beautiful Icon & PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="山上阿德提醒">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/4f46e5/ffffff?text=🏔️🏮">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>">

    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Header -->
    <header class="app-gradient text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2.5">
                <div class="bg-white/20 p-2 rounded-2xl backdrop-blur-sm border border-white/30 text-xl animate-bounce-slow shadow-sm">
                    🏔️
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black tracking-wide drop-shadow">山上阿德提醒小幫手</h1>
                    <p class="text-[11px] sm:text-xs text-indigo-100 font-medium">農曆初一十五與大小事智慧鬧鈴</p>
                </div>
            </div>
            <div class="bg-white/10 px-3 py-1.5 rounded-2xl border border-white/20 text-right">
                <div id="current-date-str" class="text-[10px] sm:text-xs font-bold text-indigo-100">載入日期中...</div>
                <div id="current-time-str" class="text-sm sm:text-base font-black tracking-wider text-white">00:00:00</div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow space-y-5">
        
        <!-- Controls & Add Button Bar -->
        <div class="bg-white rounded-3xl p-5 card-shadow border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h2 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-bell text-indigo-600"></i> 事件提醒清單
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">保持網頁在背景開啟，時間到自動語音播報與彈出鬧鈴！</p>
            </div>
            <button onclick="openEventModal()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-2xl font-bold text-xs shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> 新增提醒事件
            </button>
        </div>

        <!-- Events List Container -->
        <div id="events-container" class="space-y-3">
            <!-- Dynamic events rendered here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 mt-12 text-center text-xs">
        <p class="mb-1">山上阿德提醒小幫手 • 農曆國曆管家系統</p>
        <p>© 2026 All rights reserved. 輕鬆管理大小事，永不遺忘重要時刻！</p>
    </footer>

    <!-- Modal: Add/Edit Event -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 card-shadow border border-slate-100 max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-base font-black text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus text-indigo-600"></i> 新增提醒事件
                </h3>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold w-8 h-8 rounded-full flex items-center justify-center bg-slate-100">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="event-form" onsubmit="saveEvent(event)" class="space-y-4 text-xs font-medium">
                <input type="hidden" id="event-id">
                
                <div>
                    <label class="block text-slate-700 font-bold mb-1">事件主題名稱</label>
                    <input type="text" id="event-title" required placeholder="例如：爐主初一拜拜 / 木瓜出貨" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs focus:outline-none focus:border-indigo-500 font-semibold">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-700 font-bold mb-1">事件規則類型</label>
                        <select id="event-type" onchange="onEventTypeChanged()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs focus:outline-none focus:border-indigo-500 font-semibold">
                            <option value="lunar_recurring">1. 農曆常規循環</option>
                            <option value="gregorian_single">2. 特定單一事件</option>
                        </select>
                    </div>
                    <div id="lunar-rule-wrapper">
                        <label class="block text-slate-700 font-bold mb-1">農曆循環方式</label>
                        <select id="lunar-rule-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs focus:outline-none focus:border-indigo-500 font-semibold">
                            <option value="lunar_1">農曆初一 (當天)</option>
                            <option value="lunar_15">農曆十五 (當天)</option>
                            <option value="minus_3_days_1">農曆初一前 3 天 (木瓜出貨)</option>
                            <option value="minus_3_days_15">農曆十五前 3 天 (木瓜出貨)</option>
                            <option value="minus_1_day">農曆初一/十五前 1 天 (前一晚預備)</option>
                        </select>
                    </div>
                    <div id="solar-date-wrapper" class="hidden">
                        <label class="block text-slate-700 font-bold mb-1">指定日期</label>
                        <input type="date" id="event-solar-date" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs focus:outline-none focus:border-indigo-500 font-semibold">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold text-slate-700">24小時提醒時間與次數 (00-23 時)</label>
                        <button type="button" onclick="addReminderRow()" class="text-indigo-600 hover:text-indigo-700 font-bold flex items-center gap-1">
                            <i class="fa-solid fa-plus-circle"></i> 增加時間
                        </button>
                    </div>
                    <div id="reminder-rules-container" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- Dynamic reminder rows -->
                    </div>
                </div>

                <div>
                    <label class="block text-slate-700 font-bold mb-1">最大通知次數限制 (次)</label>
                    <input type="number" id="event-max-count" min="1" max="99" value="6" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs focus:outline-none focus:border-indigo-500 font-semibold" placeholder="例如：6次">
                </div>

                <div>
                    <label class="block text-slate-700 font-bold mb-1">詳細備註內容</label>
                    <textarea id="event-desc" rows="2" placeholder="當鬧鈴響起時，語音將會唸出或顯示此詳細內容..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeEventModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-3 rounded-xl transition">取消</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3 rounded-xl shadow-md transition">儲存事件</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alarm Ringing Modal -->
    <div id="alarm-ring-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden animate-in fade-in zoom-in duration-200">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 card-shadow border-4 border-indigo-400 text-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 text-9xl opacity-10 select-none">🔔</div>
            <div class="w-20 h-20 rounded-3xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-4xl mx-auto mb-4 animate-pulse-ring shadow-md">
                ⏰
            </div>
            <span class="bg-indigo-100 text-indigo-800 text-xs font-black px-3.5 py-1 rounded-full uppercase tracking-wider">🚨 提醒時間到！</span>
            <h3 id="ring-title" class="text-xl font-black text-slate-900 mt-3 mb-2">事件主題名稱</h3>
            <p id="ring-message" class="text-xs sm:text-sm text-slate-600 leading-relaxed font-medium mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200"></p>
            
            <div class="flex gap-3">
                <button onclick="stopAlarmAndSnooze()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs transition">
                    稍後提醒 (5分鐘)
                </button>
                <button onclick="dismissAlarm()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">
                    我知道了 (關閉)
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let events = [
            {
                id: '1',
                title: '🏮 爐主農曆初一拜拜',
                type: 'lunar_recurring',
                lunarRule: 'lunar_1',
                solarDate: '',
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '19', minute: '00', label: '前一晚預備' },
                    { hour: '06', minute: '00', label: '當天早上提醒' }
                ],
                desc: '農曆初一，請準備三牲四果拜拜祈福。'
            },
            {
                id: '2',
                title: '🏮 爐主農曆十五拜拜',
                type: 'lunar_recurring',
                lunarRule: 'lunar_15',
                solarDate: '',
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '19', minute: '00', label: '前一晚預備' },
                    { hour: '06', minute: '00', label: '當天早上提醒' }
                ],
                desc: '農曆十五，請準備澎湃供品拜拜祈福。'
            },
            {
                id: '3',
                title: '🍈 木瓜出貨預備 (農曆初一前3天)',
                type: 'lunar_recurring',
                lunarRule: 'minus_3_days_1',
                solarDate: '',
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '19', minute: '00', label: '提前3天通知' }
                ],
                desc: '農曆初一前三天，請準備木瓜出貨與宅配裝箱！'
            },
            {
                id: '4',
                title: '🍈 木瓜出貨預備 (農曆十五前3天)',
                type: 'lunar_recurring',
                lunarRule: 'minus_3_days_15',
                solarDate: '',
                maxCount: 6,
                triggeredCount: 0,
                reminders: [
                    { hour: '19', minute: '00', label: '提前3天通知' }
                ],
                desc: '農曆十五前三天，請準備木瓜出貨與宅配裝箱！'
            }
        ];

        let lastTriggeredMinuteKey = '';

        // --- Initialization ---
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(checkAlarms, 1000);
            renderEvents();
            requestNotificationPermission();
        };

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        }

        // --- Audio Chime & Speech Synthesis ---
        function playChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.12));
                    gain.gain.setValueAtTime(0.15, now + (i * 0.12));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.12) + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + (i * 0.12));
                    osc.stop(now + (i * 0.12) + 0.4);
                });
            } catch (e) {
                console.log("AudioContext restricted", e);
            }
        }

        function speakVoice(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.95;
            utterance.pitch = 1.02;

            const voices = window.speechSynthesis.getVoices();
            const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW') || v.name.includes('Taiwan') || v.name.includes('Hanhan'));
            if (twVoice) utterance.voice = twVoice;

            window.speechSynthesis.speak(utterance);
        }

        // --- Lunar Calendar Approximation ---
        function getLunarDay(date) {
            const day = date.getDate();
            const month = date.getMonth() + 1;
            let lunarDay = (day + 15) % 30;
            if (lunarDay === 0) lunarDay = 30;
            return { month, lunarDay };
        }

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const lunar = getLunarDay(now);

            document.getElementById('current-date-str').innerText = `${year}年${month}月${date}日 (農曆約 ${lunar.month}月${lunar.lunarDay}日)`;
            document.getElementById('current-time-str').innerText = `${hours}:${minutes}:${seconds}`;
        }

        // --- Real-time Alarm Checker ---
        function checkAlarms() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todaySolarStr = `${year}-${month}-${day}`;
            
            const currentHour = String(now.getHours()).padStart(2, '0');
            const currentMinute = String(now.getMinutes()).padStart(2, '0');
            const currentHMKey = `${todaySolarStr}-${currentHour}:${currentMinute}`;

            if (currentHMKey === lastTriggeredMinuteKey) return;

            const lunar = getLunarDay(now);
            const isLunar1 = (lunar.lunarDay === 1);
            const isLunar15 = (lunar.lunarDay === 15);
            const isLunarMinus3For1 = (lunar.lunarDay === 27); // 3 days before 1st (approx 27th of prev month)
            const isLunarMinus3For15 = (lunar.lunarDay === 12); // 3 days before 15th (12th)

            events.forEach(ev => {
                if (ev.maxCount && ev.triggeredCount >= ev.maxCount) return;

                ev.reminders.forEach(r => {
                    if (r.hour === currentHour && r.minute === currentMinute) {
                        let shouldTrigger = false;
                        if (ev.type === 'lunar_recurring') {
                            if (ev.lunarRule === 'lunar_1' && isLunar1) shouldTrigger = true;
                            if (ev.lunarRule === 'lunar_15' && isLunar15) shouldTrigger = true;
                            if (ev.lunarRule === 'minus_3_days_1' && isLunarMinus3For1) shouldTrigger = true;
                            if (ev.lunarRule === 'minus_3_days_15' && isLunarMinus3For15) shouldTrigger = true;
                            if (ev.lunarRule === 'minus_1_day' && (lunar.lunarDay === 29 || lunar.lunarDay === 14)) shouldTrigger = true;
                        } else if (ev.type === 'gregorian_single') {
                            if (ev.solarDate === todaySolarStr) shouldTrigger = true;
                        }

                        if (shouldTrigger) {
                            lastTriggeredMinuteKey = currentHMKey;
                            ev.triggeredCount = (ev.triggeredCount || 0) + 1;
                            renderEvents();
                            triggerAlarm(ev.title, `${r.label} (${r.hour}:${r.minute})：${ev.desc}`);
                        }
                    }
                });
            });
        }

        function triggerAlarm(title, message) {
            playChime();
            speakVoice(`${title}。${message}`);
            
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: message, icon: 'https://placehold.co/128x128/4f46e5/ffffff?text=🔔' });
            }

            document.getElementById('ring-title').innerText = title;
            document.getElementById('ring-message').innerText = message;
            document.getElementById('alarm-ring-modal').classList.remove('hidden');

            confetti({
                particleCount: 100,
                spread: 90,
                origin: { y: 0.6 }
            });
        }

        function simulateAlarmTrigger(title, message) {
            triggerAlarm(title, message);
        }

        function dismissAlarm() {
            document.getElementById('alarm-ring-modal').classList.add('hidden');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function stopAlarmAndSnooze() {
            dismissAlarm();
            alert('已設定 5 分鐘後重新提醒！');
        }

        // --- Render Events List ---
        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-12 text-center text-slate-400 card-shadow border border-slate-100">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-indigo-300"></i>
                        <p class="text-xs font-medium">目前沒有任何提醒事件，點擊上方按鈕新增！</p>
                    </div>
                `;
                return;
            }

            events.forEach(ev => {
                const typeBadge = ev.type === 'lunar_recurring' 
                    ? `<span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-moon mr-1"></i> 常規循環</span>`
                    : `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-calendar-day mr-1"></i> 單一事件 (${ev.solarDate})</span>`;

                const countBadge = `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-bell mr-1"></i> 已通知: ${ev.triggeredCount || 0} / ${ev.maxCount || '∞'} 次</span>`;

                const remindersHtml = ev.reminders.map(r => `
                    <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-semibold">
                        <i class="fa-solid fa-clock text-indigo-600"></i> ${r.hour}:${r.minute} - ${r.label}
                    </span>
                `).join('');

                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl p-5 card-shadow border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition hover:border-indigo-200";
                card.innerHTML = `
                    <div class="space-y-2 flex-grow">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h4 class="font-black text-slate-900 text-base">${ev.title}</h4>
                            ${typeBadge}
                            ${countBadge}
                        </div>
                        <p class="text-xs text-slate-600">${ev.desc || '無詳細備註'}</p>
                        <div class="flex flex-wrap gap-1.5 pt-1">
                            ${remindersHtml}
                        </div>
                    </div>
                    <div class="flex items-center gap-2 self-end sm:self-center flex-wrap">
                        <button onclick="exportToICS('${ev.id}')" class="px-3 h-9 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 hover:bg-slate-100 transition flex items-center gap-1.5 text-xs font-bold shadow-xs" title="下載行事曆檔案(.ics)">
                            <i class="fa-solid fa-calendar-plus text-indigo-600"></i> 匯入行事曆
                        </button>
                        <button onclick="simulateAlarmTrigger('${ev.title}', '${ev.desc}')" class="w-9 h-9 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 transition flex items-center justify-center text-xs shadow-xs" title="立即測試鬧鈴">
                            <i class="fa-solid fa-bell"></i>
                        </button>
                        <button onclick="editEvent('${ev.id}')" class="w-9 h-9 rounded-xl bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100 transition flex items-center justify-center text-xs shadow-xs" title="編輯事件">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteEvent('${ev.id}')" class="w-9 h-9 rounded-xl bg-slate-50 border border-rose-200 text-rose-600 hover:bg-rose-50 transition flex items-center justify-center text-xs shadow-xs" title="刪除事件">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- ICS Calendar Export ---
        function exportToICS(id) {
            const ev = events.find(e => e.id === id);
            if (!ev) return;

            let targetDateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            if (ev.type === 'gregorian_single' && ev.solarDate) {
                targetDateStr = ev.solarDate.replace(/-/g, '');
            }

            const timeObj = ev.reminders[0] || { hour: '08', minute: '00' };
            const timeStr = `${timeObj.hour}${timeObj.minute}00`;

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//山上阿德提醒小幫手//TW',
                'BEGIN:VEVENT',
                `SUMMARY:${ev.title}`,
                `DESCRIPTION:${ev.desc || ''}`,
                `DTSTART:${targetDateStr}T${timeStr}`,
                `DTEND:${targetDateStr}T${Number(timeObj.hour)+1}${timeObj.minute}00`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${ev.title}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            alert(`已下載「${ev.title}」的行事曆檔案 (.ics)！點兩下即可加入手機內建行事曆。`);
        }

        // --- Modal & Form Handling ---
        function openEventModal(eventId = null) {
            document.getElementById('event-modal').classList.remove('hidden');
            const container = document.getElementById('reminder-rules-container');
            container.innerHTML = '';

            if (eventId) {
                document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-indigo-600"></i> 編輯提醒事件';
                const ev = events.find(e => e.id === eventId);
                if (ev) {
                    document.getElementById('event-id').value = ev.id;
                    document.getElementById('event-title').value = ev.title;
                    document.getElementById('event-type').value = ev.type;
                    document.getElementById('lunar-rule-type').value = ev.lunarRule || 'lunar_1';
                    document.getElementById('event-solar-date').value = ev.solarDate || '';
                    document.getElementById('event-max-count').value = ev.maxCount || 6;
                    document.getElementById('event-desc').value = ev.desc || '';
                    onEventTypeChanged();
                    ev.reminders.forEach(r => addReminderRow(r.hour, r.minute, r.label));
                }
            } else {
                document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-calendar-plus text-indigo-600"></i> 新增提醒事件';
                document.getElementById('event-form').reset();
                document.getElementById('event-id').value = '';
                document.getElementById('event-max-count').value = 6;
                onEventTypeChanged();
                // Default to 1 reminder time
                addReminderRow('19', '00', '提醒通知');
            }
        }

        function closeEventModal() {
            document.getElementById('event-modal').classList.add('hidden');
        }

        function onEventTypeChanged() {
            const type = document.getElementById('event-type').value;
            const lunarWrapper = document.getElementById('lunar-rule-wrapper');
            const solarWrapper = document.getElementById('solar-date-wrapper');
            if (type === 'lunar_recurring') {
                lunarWrapper.classList.remove('hidden');
                solarWrapper.classList.add('hidden');
            } else {
                lunarWrapper.classList.add('hidden');
                solarWrapper.classList.remove('hidden');
            }
        }

        function addReminderRow(hourVal = '19', minuteVal = '00', labelVal = '提醒通知') {
            const container = document.getElementById('reminder-rules-container');
            
            let hoursOptions = '';
            for (let h = 0; h < 24; h++) {
                const hs = String(h).padStart(2, '0');
                hoursOptions += `<option value="${hs}" ${hs === hourVal ? 'selected' : ''}>${hs} 時</option>`;
            }

            let minutesOptions = '';
            for (let m = 0; m < 60; m += 5) {
                const ms = String(m).padStart(2, '0');
                minutesOptions += `<option value="${ms}" ${ms === minuteVal ? 'selected' : ''}>${ms} 分</option>`;
            }
            if (![0,5,10,15,20,25,30,35,40,45,50,55].includes(parseInt(minuteVal))) {
                minutesOptions += `<option value="${minuteVal}" selected>${minuteVal} 分</option>`;
            }

            const div = document.createElement('div');
            div.className = "flex items-center gap-2 reminder-row bg-slate-50 p-2 rounded-2xl border border-slate-200";
            div.innerHTML = `
                <select class="reminder-hour bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none focus:border-indigo-500">
                    ${hoursOptions}
                </select>
                <select class="reminder-minute bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none focus:border-indigo-500">
                    ${minutesOptions}
                </select>
                <input type="text" value="${labelVal}" placeholder="提醒標籤 (例: 晚上提醒)" class="reminder-label flex-grow bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-rose-600 p-2">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            `;
            container.appendChild(div);
        }

        function saveEvent(e) {
            e.preventDefault();
            const id = document.getElementById('event-id').value;
            const title = document.getElementById('event-title').value;
            const type = document.getElementById('event-type').value;
            const lunarRule = document.getElementById('lunar-rule-type').value;
            const solarDate = document.getElementById('event-solar-date').value;
            const maxCount = parseInt(document.getElementById('event-max-count').value) || 6;
            const desc = document.getElementById('event-desc').value;

            const reminderRows = document.querySelectorAll('.reminder-row');
            let reminders = [];
            reminderRows.forEach(row => {
                const hour = row.querySelector('.reminder-hour').value;
                const minute = row.querySelector('.reminder-minute').value;
                const label = row.querySelector('.reminder-label').value;
                if (hour && minute) reminders.push({ hour, minute, label });
            });

            if (id) {
                const index = events.findIndex(ev => ev.id === id);
                if (index !== -1) {
                    events[index] = { 
                        ...events[index],
                        title, type, lunarRule, solarDate, maxCount, reminders, desc 
                    };
                }
            } else {
                events.push({
                    id: Date.now().toString(),
                    title, type, lunarRule, solarDate, maxCount, triggeredCount: 0, reminders, desc
                });
            }

            closeEventModal();
            renderEvents();
            alert('提醒事件已成功儲存！');
        }

        function editEvent(id) {
            openEventModal(id);
        }

        function deleteEvent(id) {
            if (confirm('確定要刪除此提醒事件嗎？')) {
                events = events.filter(e => e.id !== id);
                renderEvents();
            }
        }
    </script>
</body>
</html>
